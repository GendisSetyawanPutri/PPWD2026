<!DOCTYPE html>
<html lang="id">
<head>
    <title>Kartu Profil & Todo</title>
    <style>
        body {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 1.5px;
            background-color: #ffdaf0;
        }
        header {
            background-color: #f55cb0;
            color: #ffe9f6;
            text-align: center;
            padding: 25px;
        }
        main {
            max-width: 800px;
            margin: 30px auto;
            padding: 60px;
        }
        section {
            background-color: #f3a4d3;
            color: #f2f8c2;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            text-align: center;
            border: 2px solid #f55cb0
        }
        .skill-list {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }
        .skill {
            background-color: #f3f0c8;
            color: #ff3399;
            padding: 10px 10px;
            border-radius: 12px;
            border: 3px solid #ff3399;
            box-shadow: 2px 3px 0px #ff3399;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            flex: 1;
            min-width: 150px;
        }
        .todo-form {
            display: flex;
            gap: 10px;
        }
        .todo-form input {
            flex: 1;
            padding: 10px;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .tambah {
            background-color: #84ceff;
            color: #f2f8c2;
            border-radius: 5px;
            border: 2px solid #1893e6;
        }
        .todo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin-top: 10px;
            background-color: #afdfff;
            border-radius: 5px;
            border: 2px solid #1893e6;
        }
        .selesai {
            text-decoration: line-through;
        }
        .btn-selesai {
            background-color: #1893e6;
            color: #ffffff;
        }
        .btn-hapus {
            background-color: #f55cb0;
            color: #ffffff;
        }
        footer {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Gendis Setyawan Putri</h1>
        <p>Mahasiswi Sistem Informasi</p>
        <p>H1101251011</p>
    </header>
    <main>
        <section>
            <h2>Skill Saya</h2>
            <div class="skill-list">
                <div class="skill">Graphic Design</div>
                <div class="skill">Editing</div>
                <div class="skill">Drawing</div>
            </div>
        </section>
        <section>
            <h2>Daftar Tugas</h2>
            <div class="todo-form">
                <input type="text" id="todo_251011" placeholder="Masukkan tugas">
                <button class="tambah" onclick="tambahTodo_251011()">Tambah</button>
            </div>
            <div id="listTodo_251011"></div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Gendis Setyawan Putri</p>
    </footer>
    <script>
        let inputTodo_251011 = document.getElementById("todo_251011");
        let listTodo_251011 = document.getElementById("listTodo_251011");
        function tambahTodo_251011() {
            let tugas_251011 = inputTodo_251011.value;
            if (tugas_251011 === "") {
                alert("Tugas tidak boleh kosong!");
                return;
            }
            let todo_251011 = document.createElement("div");
            todo_251011.className = "todo";
            todo_251011.innerHTML = `
                <span>${tugas_251011}</span>
                <div>
                    <button class="btn-selesai" onclick="selesaiTodo_251011(this)">Selesai</button>
                    <button class="btn-hapus" onclick="hapusTodo_251011(this)">Hapus</button>
                </div>
            `;
            listTodo_251011.appendChild(todo_251011);
            inputTodo_251011.value = "";
        }
        function selesaiTodo_251011(button) {
            let todo_251011 = button.parentElement.parentElement;
            let teks_251011 = todo_251011.querySelector("span");
            teks_251011.classList.toggle("selesai");
        }
        function hapusTodo_251011(button) {
            let todo_251011 = button.parentElement.parentElement;
            todo_251011.remove();
        }
    </script>
</body>
</html>
